# The test suite on the six targets. It runs only when started by hand,
# because hosted build minutes are limited. A release starts it by hand as
# well.
name: test

on:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
          # GitHub offers an Intel runner of macOS for as long as it does.
          # The development Mac covers macos-x86_64 under Rosetta as well.
          - target: macos-x86_64
            runner: macos-15-intel
          - target: windows-x86_64
            runner: windows-2025
            msvc: x64
          - target: windows-arm64
            runner: windows-11-arm
            msvc: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}

      - name: Install raylib for the ABI tests
        if: runner.os != 'Windows'
        run: cmake -DDEST=build/deps/raylib -P tools/get-raylib.cmake

      # The configure step downloads the pinned clang and the LLVM tools
      # that tools/clang-pin and tools/llvm-pin name. It checks each against
      # its pin and the signature of SHA256SUMS. Ninja runs the build,
      # because the Visual Studio generator takes the compiler of its own
      # toolset.
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/host

      - name: Test
        run: ctest --test-dir build/host --output-on-failure
