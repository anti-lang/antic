# The test suite on the six targets. It runs only when started by hand,
# because hosted build minutes are limited. A release starts it by hand as
# well.
name: test

on:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
          # GitHub offers an Intel runner of macOS for as long as it does.
          # The development Mac covers macos-x86_64 under Rosetta as well.
          - target: macos-x86_64
            runner: macos-15-intel
          - target: windows-x86_64
            runner: windows-2025
            msvc: x64
          - target: windows-arm64
            runner: windows-11-arm
            msvc: arm64
    steps:
      - uses: actions/checkout@v4

      # The script installs the tools of the release that tools/llvm-pin
      # names. It checks the asset against the pin and SHA256SUMS against
      # its signature. Every tool must report the pinned version.
      - name: Install the pinned LLVM tools
        run: cmake -P tools/get-llvm.cmake

      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}

      - name: Install raylib for the ABI tests
        if: runner.os != 'Windows'
        run: cmake -DDEST=build/raylib -P tools/get-raylib.cmake

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
